services:
  bridge:
    build:
      context: .
      args:
        INSTALL_SING_BOX: "${INSTALL_SING_BOX:-true}"
        OPENCODE_BRIDGE_SING_BOX_VERSION: "${OPENCODE_BRIDGE_SING_BOX_VERSION:-1.13.16}"
        OPENCODE_BRIDGE_SING_BOX_FLAVOR: "${OPENCODE_BRIDGE_SING_BOX_FLAVOR:-}"
        OPENCODE_BRIDGE_SING_BOX_DOWNLOAD_URL: "${OPENCODE_BRIDGE_SING_BOX_DOWNLOAD_URL:-}"
        OPENCODE_BRIDGE_SING_BOX_SHA256: "${OPENCODE_BRIDGE_SING_BOX_SHA256:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - bridge-data:/app/data
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"

volumes:
  bridge-data:

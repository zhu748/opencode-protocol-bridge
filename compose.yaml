services:
  bridge:
    build:
      context: .
      args:
        INSTALL_SING_BOX: "${INSTALL_SING_BOX:-true}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - bridge-data:/app/data
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      CONFIG_ENCRYPTION_KEY: "${CONFIG_ENCRYPTION_KEY:-}"
      OPENCODE_BRIDGE_MAX_ADMIN_MUTATIONS: "${OPENCODE_BRIDGE_MAX_ADMIN_MUTATIONS:-16}"
      OPENCODE_BRIDGE_MAX_ADMIN_MODEL_DISCOVERIES: "${OPENCODE_BRIDGE_MAX_ADMIN_MODEL_DISCOVERIES:-4}"
      OPENCODE_BRIDGE_MAX_HTTP_CONNECTIONS: "${OPENCODE_BRIDGE_MAX_HTTP_CONNECTIONS:-256}"
      OPENCODE_BRIDGE_STREAM_WRITE_TIMEOUT_MS: "${OPENCODE_BRIDGE_STREAM_WRITE_TIMEOUT_MS:-30000}"
      OPENCODE_BRIDGE_IMAGE_HANDOFF_PUBLIC_URL: "${OPENCODE_BRIDGE_IMAGE_HANDOFF_PUBLIC_URL:-}"
      OPENCODE_BRIDGE_IMAGE_HANDOFF_MAX_BYTES: "${OPENCODE_BRIDGE_IMAGE_HANDOFF_MAX_BYTES:-268435456}"
      OPENCODE_BRIDGE_IMAGE_HANDOFF_LOCAL_RETENTION_MS: "${OPENCODE_BRIDGE_IMAGE_HANDOFF_LOCAL_RETENTION_MS:-86400000}"
      OPENCODE_BRIDGE_SING_BOX_PATH: "${OPENCODE_BRIDGE_SING_BOX_PATH:-/app/vendor/sing-box/sing-box}"

volumes:
  bridge-data:

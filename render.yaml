services:
  - type: web
    name: opencode-protocol-bridge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --ignore-scripts && npm run install:sing-box
    startCommand: npm start
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OPENCODE_BRIDGE_TRUST_PROXY
        value: true
      - key: OPENCODE_BRIDGE_REQUIRE_ENV_BOOTSTRAP
        value: true
      - key: OPENCODE_BRIDGE_MAX_ADMIN_MUTATIONS
        value: 16
      - key: OPENCODE_BRIDGE_MAX_ADMIN_MODEL_DISCOVERIES
        value: 4
      - key: OPENCODE_BRIDGE_MAX_HTTP_CONNECTIONS
        value: 256
      - key: OPENCODE_BRIDGE_MAX_INFLIGHT_REQUEST_BODY_BYTES
        value: 67108864
      - key: OPENCODE_BRIDGE_MAX_CLIENT_INFLIGHT_REQUEST_BODY_BYTES
        value: 20971520
      - key: OPENCODE_BRIDGE_STREAM_WRITE_TIMEOUT_MS
        value: 30000
      - key: OPENCODE_BRIDGE_SSE_HEARTBEAT_MS
        value: 15000
      - key: OPENCODE_BRIDGE_STATS_MAX_BYTES
        value: 67108864
      - key: OPENCODE_BRIDGE_KEEP_ALIVE_URL
        sync: false
      - key: OPENCODE_BRIDGE_KEEP_ALIVE_INTERVAL_SECONDS
        value: 60
      - key: CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: OPENCODE_BRIDGE_ADMIN_PASSWORD
        sync: false
      - key: OPENCODE_BRIDGE_CLIENT_TOKEN
        sync: false
      - key: OPENCODE_BRIDGE_IMAGE_HANDOFF_PUBLIC_URL
        sync: false
      - key: OPENCODE_BRIDGE_IMAGE_HANDOFF_MAX_BYTES
        value: 268435456
      - key: OPENCODE_BRIDGE_IMAGE_HANDOFF_LOCAL_RETENTION_MS
        value: 86400000
      - key: OPENCODE_BRIDGE_SING_BOX_PATH
        value: /opt/render/project/src/vendor/sing-box/sing-box
      - key: OPENCODE_BRIDGE_SING_BOX_VERSION
        value: 1.13.16
      - key: OPENCODE_BRIDGE_DEFAULT_PROVIDER
        value: zen
      - key: OPENCODE_PROXY_URL
        sync: false
      - key: OPENCODE_ZEN_PROXY_URL
        sync: false
      - key: OPENCODE_GO_PROXY_URL
        sync: false
      - key: OPENCODE_ZEN_KEYS
        sync: false
      - key: OPENCODE_GO_KEYS
        sync: false
      - key: OPENCODE_ZEN_PROXY_URLS
        sync: false
      - key: OPENCODE_GO_PROXY_URLS
        sync: false
      - key: OPENCODE_ZEN_KEY_1
        sync: false
      - key: OPENCODE_ZEN_KEY_2
        sync: false
      - key: OPENCODE_ZEN_KEY_3
        sync: false
      - key: OPENCODE_ZEN_KEY_4
        sync: false
      - key: OPENCODE_GO_KEY_1
        sync: false
      - key: OPENCODE_GO_KEY_2
        sync: false
      - key: OPENCODE_GO_KEY_3
        sync: false
      - key: OPENCODE_GO_KEY_4
        sync: false
      - key: OPENCODE_ZEN_PROXY_URL_1
        sync: false
      - key: OPENCODE_ZEN_PROXY_URL_2
        sync: false
      - key: OPENCODE_ZEN_PROXY_URL_3
        sync: false
      - key: OPENCODE_ZEN_PROXY_URL_4
        sync: false
      - key: OPENCODE_GO_PROXY_URL_1
        sync: false
      - key: OPENCODE_GO_PROXY_URL_2
        sync: false
      - key: OPENCODE_GO_PROXY_URL_3
        sync: false
      - key: OPENCODE_GO_PROXY_URL_4
        sync: false
